<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div>
            <img src="img/8942d9e5a5edb11f6ca6a9ee02d60d5c~tplv-tiktokx-cropcenter_1080_1080.jpeg"
             alt="mokhtar" width="100" height="100">
        </div>
        <div class="links">
            <a href="index.html">Home</a>
            <a href="about.html">about</a>
            <a href="contact.html">contact </a>
        </div>
    </nav>
    <!--section contact -->
    <section class="contact">
        <h1>Contact Us</h1>
        <p>Feel free to reach out to us!</p>
    </section>
    <form>
    <!-- text section -->
    <div class="text">
        <label for="username"><b>Name:</b></label>
        <br>
        <input type="text" id="username" name="username">
    </div>
    <!-- email section -->
    <div class="email">
        <label for="email"><b>Email:</b></label>
        <br>
        <input type="email" id="email" name="email">
    </div>
    <!-- number section -->
    <div class="number">
        <label for="number"><b>Number:</b></label>
        <br>
        <input type="number" id="number" name="number">
    </div>
    <!-- date section -->
    <div class="date">
        <label for="date">Date</label>
        <br>
        <input type="date" id="date" name="date">
    </div>
    <!-- Radio buttons section -->  
    <div class="radio">
        <b>Select your gender:</b>
        <br>
        <br>
        <label for="option1">Male</label>
        <input type="radio" id="option1" name="options" value="option1">
        <br>
        <label for="option2">Female</label>
        <input type="radio" id="option2" name="options" value="option2"> 
    </div>
    <!-- checkbox section -->
    <div class="checkbox">
        <b>Any skills:</b>
        <br>
        <br>
        <label for="option1">html</label>
        <input type="checkbox" id="option1_cb" name="options" value="option1">
        <br>
        <label for="option2">Css</label>
        <input type="checkbox" id="option2_cb" name="options" value="option2">
        <br>
        <label for="option3_cb">JavaScript</label>
        <input type="checkbox" id="option3_cb" name="options" value="option3">
        <br>
        <label for="option4_cb">none</label>
        <input type="checkbox" id="option4_cb" name="options" value="option4">
    </div>
    <!-- Dropdown section -->
    <div class="dropdown">
        <label for="country"><b>Country:</b></label>
        <br>
        <select id="country" name="country">
            <option value="egypt">Egypt</option>
            <option value="canada">Canada</option>
            <option value="uk">UK</option>
        </select>
    </div>
    <!-- Large text box (textarea) -->
    <div class="text">
        <label for="message"><b>Message:</b></label>
        <br>
        <textarea id="message" name="message" rows="4" cols="50"></textarea>
    </div>
    <button type="submit">Submit</button>
    </form>
</body>
</html>
